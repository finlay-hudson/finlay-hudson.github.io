<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Real-VAS Containment Gallery (pick candidates)</title>
<style>
    body { font-family: system-ui, sans-serif; background: #fafafa; color: #222; margin: 0; padding: 24px; }
    h1 { margin: 0 0 6px; }
    .sub { color: #666; margin-bottom: 24px; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .item { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px; }
    .item video { width: 100%; height: auto; display: block; border-radius: 4px; background: #000; }
    .name { font-family: monospace; font-size: 0.85rem; margin-top: 8px; color: #444; }
    .controls { position: sticky; top: 0; background: #fafafa; padding: 8px 0 16px; margin-bottom: 8px; z-index: 10; border-bottom: 1px solid #eee; }
    .controls button { font-size: 0.85rem; padding: 4px 10px; margin-right: 6px; cursor: pointer; }
    .picked { outline: 3px solid #c08b3a; }
</style>
</head>
<body>

<h1>Real-VAS Containment Candidates</h1>
<div class="sub">
    29 clips with visible CoTracker3 point overlays. Click a tile to mark it as a pick; the chosen filenames
    appear in the box at the top for easy copy-paste. All videos autoplay/loop.
</div>

<div class="controls">
    <button onclick="document.querySelectorAll('.item').forEach(e=>e.classList.remove('picked'));document.getElementById('picks').textContent='';">
        Clear picks
    </button>
    <span>Picked:</span>
    <code id="picks" style="padding: 4px 8px; background: #fff;"></code>
</div>

<h2 style="margin-top: 24px; border-bottom: 2px solid #c08b3a; padding-bottom: 4px;">Containment GT</h2>
<div class="grid" id="grid-ct"></div>

<h2 style="margin-top: 32px; border-bottom: 2px solid #c08b3a; padding-bottom: 4px;">Cup Games</h2>
<div class="grid" id="grid-cg"></div>

<script>
const CT_CLIPS = [
  "IMG_7277","IMG_7662","IMG_7662-1","IMG_7665","IMG_7666","IMG_7666-1","IMG_7667","IMG_7668",
  "IMG_7682","IMG_7682-1","IMG_7682-2","IMG_7682-3","IMG_7682-4","IMG_7684","IMG_7684-1",
  "IMG_7686","IMG_7687","IMG_7689","IMG_7695","IMG_7700","IMG_7702","IMG_7703","IMG_7703-1",
  "IMG_7704","IMG_7706","IMG_7708","IMG_7749","IMG_7753","IMG_7754"
];
const CG_CLIPS = ["cupgame_IMG_7231","cupgame_IMG_7237","cupgame_IMG_7239"];
const picksEl = document.getElementById('picks');
const picked = new Set();
function addGrid(container, clips) {
    clips.forEach(c => {
        const d = document.createElement('div');
        d.className = 'item';
        d.innerHTML = '<video src="videos/containment_gallery/'+c+'.mp4" autoplay loop muted playsinline></video>' +
                      '<div class="name">'+c+'</div>';
        d.addEventListener('click', () => {
            if (picked.has(c)) { picked.delete(c); d.classList.remove('picked'); }
            else { picked.add(c); d.classList.add('picked'); }
            picksEl.textContent = [...picked].join(', ');
        });
        container.appendChild(d);
    });
}
addGrid(document.getElementById('grid-ct'), CT_CLIPS);
addGrid(document.getElementById('grid-cg'), CG_CLIPS);
</script>

</body>
</html>
